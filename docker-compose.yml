services:
  app:
    build: .
    container_name: sermon-clipper
    # Publish to localhost only — the API is unauthenticated and must not be
    # reachable from the LAN.
    ports:
      - "127.0.0.1:8000:8000"
    # Pulls GEMINI_API_KEY (server-side key → no per-user prompt), GEMINI_BASE_URL
    # (gateway), AWS_*, etc. from your .env at runtime.
    env_file:
      - path: .env
        required: false
    volumes:
      - ./output:/app/output          # generated clips show up on the host
      - model-cache:/root/.cache      # persist Whisper/HF model downloads between runs
    restart: unless-stopped
    # Hardening: the media pipeline (ffmpeg/yt-dlp) processes untrusted input.
    # It needs no Linux capabilities and should never gain new privileges.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL

volumes:
  model-cache:
