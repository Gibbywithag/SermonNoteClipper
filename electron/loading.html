<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; font-src 'self';" />
  <title>Sermon Note Clipper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #0c0c0e;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      overflow: hidden;
    }
    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      -webkit-app-region: drag;
    }
    .logo {
      width: 76px; height: 76px; border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px;
      background: linear-gradient(145deg, #1d4ed8, #4f46e5);
      box-shadow: 0 10px 40px rgba(79, 70, 229, 0.35);
    }
    h1 { font-size: 19px; font-weight: 700; color: #fff; letter-spacing: -0.01em; }
    .sub { font-size: 13px; color: #71717a; }
    .bar {
      width: 180px; height: 3px; border-radius: 3px; overflow: hidden;
      background: rgba(255,255,255,0.08);
    }
    .bar > span {
      display: block; height: 100%; width: 40%; border-radius: 3px;
      background: linear-gradient(90deg, #1d4ed8, #4f46e5);
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">✂️</div>
    <h1>Sermon Note Clipper</h1>
    <div class="sub">Starting the engine…</div>
    <div class="bar"><span></span></div>
  </div>
</body>
</html>
