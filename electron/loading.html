<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline';" />
  <title>Sermon Note Clipper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #FAF9F8;
      color: #171413;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      -webkit-user-select: none; user-select: none; overflow: hidden;
    }
    .wrap {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
    }
    .logo {
      width: 72px; height: 72px; border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-family: Georgia, "Times New Roman", serif; font-style: italic;
      font-size: 38px; color: #FBF8F4; background: #463A38;
      box-shadow: 0 14px 36px -16px rgba(70, 57, 55, 0.55);
    }
    h1 { font-family: Georgia, serif; font-style: italic; font-size: 22px; font-weight: 600; color: #171413; }
    .sub { font-size: 13px; color: #6F6862; }
    .bar { width: 180px; height: 3px; border-radius: 3px; overflow: hidden; background: #E7E1D9; }
    .bar > span {
      display: block; height: 100%; width: 40%; border-radius: 3px;
      background: #463A38; animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">S</div>
    <h1>Sermon Note Clipper</h1>
    <div class="sub">Starting the engine…</div>
    <div class="bar"><span></span></div>
  </div>
</body>
</html>
